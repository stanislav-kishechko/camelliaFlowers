<div id="newOrderModal"
     class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
    <div class="p-4 md:p-6 border-b border-gray-100">
      <div class="flex items-center justify-between">
        <h3 class="text-xl md:text-2xl font-bold text-gray-800">Нове замовлення</h3>
        <button onclick="closeNewOrderModal()" class="text-gray-400 hover:text-gray-600">
          <span class="text-2xl">×</span>
        </button>
      </div>
    </div>

    <div class="p-4 md:p-6">
      <form id="newOrderForm" class="space-y-6">
        {% csrf_token %}

        <div class="space-y-4">
          <h4 class="text-lg font-semibold text-gray-700 border-b pb-2">👤 Клієнт</h4>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Телефон клієнта *</label>
            <input type="tel"
                   id="new_client_phone"
                   placeholder="+380 XX XXX XXXX"
                   autocomplete="off"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent">

            <div id="phone_suggestions"
                 class="hidden mt-1 bg-white border border-gray-200 rounded-lg shadow-lg max-h-48 overflow-y-auto z-10"></div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Ім'я *</label>
              <input type="text"
                     id="new_client_first_name"
                     required
                     placeholder="Іван"
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Прізвище</label>
              <input type="text"
                     id="new_client_last_name"
                     placeholder="Іванов"
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent">
            </div>
          </div>

          <input type="hidden" id="new_client_id">

          <div id="client_status" class="hidden p-3 rounded-lg">
            <p class="text-sm font-medium"></p>
          </div>
        </div>

        <div class="space-y-4">
          <div class="flex items-center justify-between border-b pb-2">
            <h4 class="text-lg font-semibold text-gray-700">🛍️ Товари</h4>
            <span class="text-sm text-gray-500" id="items_count">0 товарів</span>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Додати товар</label>
            <div class="relative">
              <input type="text"
                     id="new_product_search"
                     placeholder="🔍 Почніть вводити назву продукту..."
                     autocomplete="off"
                     class="w-full px-4 py-2 pr-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent">
              <span class="absolute right-3 top-2.5 text-gray-400">🔍</span>

              <div id="product_suggestions"
                   class="hidden absolute z-20 w-full mt-1 bg-white border border-gray-200 rounded-lg shadow-lg max-h-64 overflow-y-auto"></div>
            </div>
          </div>

          <div id="selected_items_container" class="space-y-2">
          </div>

          <div id="no_items_message"
               class="text-center p-6 bg-gray-50 rounded-lg border-2 border-dashed border-gray-300">
            <p class="text-gray-500">📦 Додайте товари до замовлення</p>
          </div>
        </div>

        <div
            class="bg-gradient-to-br from-pink-50 to-purple-50 rounded-lg p-4 border border-pink-100">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-sm text-gray-600">Загальна сума</p>
              <p class="text-3xl font-bold text-pink-600" id="new_total_price">₴0.00</p>
            </div>
            <div class="text-right">
              <p class="text-xs text-gray-500">Товарів</p>
              <p class="text-lg font-semibold text-gray-700" id="new_items_total">0</p>
            </div>
          </div>
        </div>

        <div class="space-y-4">
          <h4 class="text-lg font-semibold text-gray-700 border-b pb-2">🚚 Доставка</h4>

          <div class="flex items-center space-x-4 p-4 bg-gray-50 rounded-lg">
            <label class="flex items-center space-x-2 cursor-pointer">
              <input type="radio"
                     name="order_type"
                     value="pickup"
                     checked
                     onchange="toggleDeliveryFields(false)"
                     class="w-4 h-4 text-pink-600 focus:ring-pink-500">
              <span class="text-gray-700 font-medium">🏪 Самовивіз</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer">
              <input type="radio"
                     name="order_type"
                     value="delivery"
                     onchange="toggleDeliveryFields(true)"
                     class="w-4 h-4 text-pink-600 focus:ring-pink-500">
              <span class="text-gray-700 font-medium">🚚 Доставка</span>
            </label>
          </div>

          <div id="delivery_fields" class="hidden space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Дата доставки *</label>
                <input type="date"
                       id="new_delivery_date"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Час доставки</label>
                <input type="time"
                       id="new_delivery_time"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent">
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Адреса доставки *</label>
              <input type="text"
                     id="new_delivery_address"
                     placeholder="вул. Хрещатик, 22"
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent">
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Примітки</label>
            <textarea id="new_notes"
                      rows="3"
                      placeholder="Додаткова інформація про замовлення..."
                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent"></textarea>
          </div>
        </div>

        <div
            class="flex flex-col sm:flex-row justify-end space-y-2 sm:space-y-0 sm:space-x-3 pt-4 border-t border-gray-100">
          <button type="button"
                  onclick="closeNewOrderModal()"
                  class="px-6 py-2.5 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 font-medium transition">
            Скасувати
          </button>
          <button type="submit"
                  id="submit_order_btn"
                  class="px-6 py-2.5 bg-gradient-to-r from-pink-500 to-pink-600 hover:from-pink-600 hover:to-pink-700 text-white rounded-lg font-medium transition shadow-lg shadow-pink-500/30">
            <span class="flex items-center justify-center">
              <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
              </svg>
              Створити замовлення
            </span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<style>
    .suggestion-item {
        padding: 0.75rem 1rem;
        cursor: pointer;
        transition: background-color 0.15s;
        border-bottom: 1px solid #f3f4f6;
    }

    .suggestion-item:hover {
        background-color: #fdf2f8;
    }

    .suggestion-item:last-child {
        border-bottom: none;
    }

    .product-suggestion-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem 1rem;
        cursor: pointer;
        transition: background-color 0.15s;
        border-bottom: 1px solid #f3f4f6;
    }

    .product-suggestion-item:hover {
        background-color: #fdf2f8;
    }

    .product-suggestion-item:last-child {
        border-bottom: none;
    }

    .order-item-card {
        background: linear-gradient(to bottom right, #fdf2f8, #faf5ff);
        border: 1px solid #fbcfe8;
        border-radius: 0.5rem;
        padding: 1rem;
        margin-bottom: 0.5rem;
        transition: all 0.2s;
    }

    .order-item-card:hover {
        box-shadow: 0 4px 6px -1px rgba(236, 72, 153, 0.1);
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .item-enter {
        animation: slideIn 0.3s ease-out;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            max-height: 0;
        }
        to {
            opacity: 1;
            max-height: 500px;
        }
    }

    .delivery-fields-show {
        animation: fadeIn 0.3s ease-out;
    }
</style>

<script>
    function toggleDeliveryFields(show) {
        const deliveryFields = document.getElementById('delivery_fields');
        const deliveryDateInput = document.getElementById('new_delivery_date');
        const deliveryAddressInput = document.getElementById('new_delivery_address');

        if (show) {
            deliveryFields.classList.remove('hidden');
            deliveryFields.classList.add('delivery-fields-show');

            const today = new Date().toISOString().split('T')[0];
            deliveryDateInput.setAttribute('min', today);

            deliveryDateInput.setAttribute('required', 'required');
            deliveryAddressInput.setAttribute('required', 'required');
        } else {
            deliveryFields.classList.add('hidden');
            deliveryFields.classList.remove('delivery-fields-show');

            deliveryDateInput.value = '';
            document.getElementById('new_delivery_time').value = '';
            deliveryAddressInput.value = '';

            deliveryDateInput.removeAttribute('required');
            deliveryAddressInput.removeAttribute('required');
        }
    }
</script>
