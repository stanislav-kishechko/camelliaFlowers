{% if page_obj.has_other_pages %}
  <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mt-6">
    <p class="text-sm text-gray-600">
      Показано {{ page_obj.start_index }}-{{ page_obj.end_index }} з {{ page_obj.paginator.count }}
    </p>
    <div class="flex space-x-2">
      {% if page_obj.has_previous %}
        <a href="?page=1"
           class="px-3 md:px-4 py-2 border border-gray-200 rounded-lg hover:bg-gray-50 text-gray-600 transition text-sm">
          ⏮️
        </a>
        <a href="?page={{ page_obj.previous_page_number }}"
           class="px-3 md:px-4 py-2 border border-gray-200 rounded-lg hover:bg-gray-50 text-gray-600 transition text-sm">
          Попередня
        </a>
      {% endif %}

      <span class="px-3 md:px-4 py-2 bg-pink-500 text-white rounded-lg text-sm">
            {{ page_obj.number }}
        </span>

      {% if page_obj.has_next %}
        <a href="?page={{ page_obj.next_page_number }}"
           class="px-3 md:px-4 py-2 border border-gray-200 rounded-lg hover:bg-gray-50 text-gray-600 transition text-sm">
          Наступна
        </a>
        <a href="?page={{ page_obj.paginator.num_pages }}"
           class="px-3 md:px-4 py-2 border border-gray-200 rounded-lg hover:bg-gray-50 text-gray-600 transition text-sm">
          ⏭️
        </a>
      {% endif %}
    </div>
  </div>
{% endif %}
