<!-- Delete Product Modal Component -->
<div id="deleteProductModal"
     class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full">
    <div class="p-6 border-b border-gray-100">
      <div class="flex items-center justify-between">
        <h3 class="text-xl font-bold text-gray-800">Видалити продукт</h3>
        <button onclick="closeDeleteModal()" class="text-gray-400 hover:text-gray-600">
          <span class="text-2xl">×</span>
        </button>
      </div>
    </div>

    <div class="p-6">
      <div class="text-center mb-6">
        <div
            class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
          <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
        </div>
        <p class="text-gray-700 mb-2">Ви впевнені, що хочете видалити продукт?</p>
        <p class="text-lg font-semibold text-gray-900" id="delete_product_name"></p>
        <p class="text-sm text-red-600 mt-2">Цю дію не можна буде скасувати!</p>
      </div>

      <form method="post" id="deleteProductForm">
        {% csrf_token %}
        <div class="flex space-x-3">
          <button type="button" onclick="closeDeleteModal()"
                  class="flex-1 px-6 py-3 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 font-medium transition">
            Скасувати
          </button>
          <button type="submit"
                  class="flex-1 px-6 py-3 bg-red-500 hover:bg-red-600 text-white rounded-lg font-medium transition shadow-lg shadow-red-500/30">
            Видалити
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
