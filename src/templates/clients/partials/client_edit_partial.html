<div id="editClientModal"
     class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
    <div class="p-4 md:p-6 border-b border-gray-100">
      <div class="flex items-center justify-between">
        <h3 class="text-xl md:text-2xl font-bold text-gray-800">Редагувати клієнта</h3>
        <button onclick="closeEditClientModal()" class="text-gray-400 hover:text-gray-600">
          <span class="text-2xl">×</span>
        </button>
      </div>
    </div>
    <div class="p-4 md:p-6">
      <form method="post" id="editClientForm" class="space-y-4">
        {% csrf_token %}
        <input type="hidden" id="edit_client_id" name="client_id">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Ім'я *</label>
            <input type="text" name="first_name" id="edit_first_name" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Прізвище *</label>
            <input type="text" name="last_name" id="edit_last_name" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Телефон *</label>
            <input type="tel" name="phone" id="edit_phone" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
            <input type="email" name="email" id="edit_email"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Адреса</label>
          <input type="text" name="address" id="edit_address"
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Місто</label>
            <input type="text" name="city" id="edit_city"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Тип клієнта</label>
            <select name="client_type" id="edit_client_type"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent">
              <option value="regular">Звичайний</option>
              <option value="vip">VIP</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Примітки</label>
          <textarea name="notes" id="edit_notes" rows="3"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent"></textarea>
        </div>

        <div class="bg-gradient-to-br from-pink-50 to-purple-50 rounded-lg p-4 border border-pink-100">
          <div class="flex items-center justify-between">
            <div>
              <label for="edit_is_active" class="text-sm font-medium text-gray-800 flex items-center">
                <svg class="w-5 h-5 mr-2 text-pink-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                Активний клієнт
              </label>
              <p class="text-xs text-gray-600 mt-1 ml-7">Клієнт буде активним в системі</p>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" name="is_active" id="edit_is_active" class="sr-only peer">
              <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-pink-300 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-pink-600"></div>
            </label>
          </div>
        </div>

        <div class="bg-gradient-to-br from-blue-50 to-pink-50 rounded-xl p-5 border border-blue-100">
          <h4 class="text-sm font-semibold text-gray-700 mb-3 flex items-center">
            <svg class="w-4 h-4 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
            </svg>
            Статистика замовлень
          </h4>
          <div class="grid grid-cols-3 gap-4">
            <div class="bg-white rounded-lg p-3 border border-blue-100">
              <div class="flex items-center justify-between mb-1">
                <p class="text-xs text-gray-500">Замовлень</p>
                <span class="text-lg">📦</span>
              </div>
              <p class="text-xl font-bold text-blue-600" id="edit_orders_count">0</p>
            </div>
            <div class="bg-white rounded-lg p-3 border border-pink-100">
              <div class="flex items-center justify-between mb-1">
                <p class="text-xs text-gray-500">Загальна сума</p>
                <span class="text-lg">💰</span>
              </div>
              <p class="text-xl font-bold text-pink-600" id="edit_total_spent">₴0.00</p>
            </div>
            <div class="bg-white rounded-lg p-3 border border-green-100">
              <div class="flex items-center justify-between mb-1">
                <p class="text-xs text-gray-500">Середній чек</p>
                <span class="text-lg">💳</span>
              </div>
              <p class="text-xl font-bold text-green-600" id="edit_average_order">₴0.00</p>
            </div>
          </div>
          <div class="mt-3 pt-3 border-t border-blue-100">
            <div class="flex items-center justify-between text-xs">
              <span class="text-gray-600">Клієнт з:</span>
              <span class="font-medium text-gray-800" id="edit_created_at">-</span>
            </div>
          </div>
        </div>

        <div class="flex flex-col sm:flex-row justify-end space-y-2 sm:space-y-0 sm:space-x-3 pt-4 border-t border-gray-100">
          <button type="button" onclick="closeEditClientModal()"
                  class="px-6 py-2.5 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 font-medium transition">
            Скасувати
          </button>
          <button type="submit"
                  class="px-6 py-2.5 bg-gradient-to-r from-pink-500 to-pink-600 hover:from-pink-600 hover:to-pink-700 text-white rounded-lg font-medium transition shadow-lg shadow-pink-500/30">
            <span class="flex items-center justify-center">
              <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M5 13l4 4L19 7"/>
              </svg>
              Зберегти зміни
            </span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
