<div id="deleteClientModal"
     class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full">
    <div class="p-6 border-b border-gray-100">
      <div class="flex items-center justify-between">
        <h3 class="text-xl font-bold text-red-600 flex items-center">
          <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
          Видалення клієнта
        </h3>
        <button onclick="closeDeleteClientModal()" class="text-gray-400 hover:text-gray-600">
          <span class="text-2xl">×</span>
        </button>
      </div>
    </div>
    <form method="post" id="deleteClientForm">
      {% csrf_token %}
      <input type="hidden" id="delete_client_id" name="client_id">
      <div class="p-6">
        <div class="bg-red-50 border border-red-200 rounded-lg p-4 mb-4">
          <p class="text-gray-800 mb-3">
            Ви впевнені, що хочете видалити клієнта?
          </p>
          <div class="bg-white rounded-lg p-3 mb-3">
            <p class="font-semibold text-gray-900" id="delete_client_name"></p>
            <p class="text-sm text-gray-600" id="delete_client_phone"></p>
          </div>
          <p class="text-sm text-red-600 font-medium">
            ⚠️ Ця дія незворотна! Усі дані про клієнта буде видалено.
          </p>
        </div>
      </div>
      <div
          class="p-6 bg-gray-50 rounded-b-2xl flex flex-col sm:flex-row justify-end space-y-2 sm:space-y-0 sm:space-x-3">
        <button type="button" onclick="closeDeleteClientModal()"
                class="px-6 py-2.5 border border-gray-300 rounded-lg text-gray-700 hover:bg-white font-medium transition">
          Скасувати
        </button>
        <button type="submit"
                class="px-6 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium transition shadow-lg shadow-red-600/30">
          <span class="flex items-center justify-center">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
            Видалити клієнта
          </span>
        </button>
      </div>
    </form>
  </div>
</div>
