[project]
name = "camelliaflowers"
version = "0.1.0"
description = "CRM for flowers shop"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0",
    "django_htmx",
    "django-debug-toolbar>=6.1.0",
    "psycopg2-binary>=2.9.11",
    "python-decouple>=3.8",
    "whitenoise>=6.11.0",
    "gunicorn>=23.0.0",
    "cloudinary",
    "pillow>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7",
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
pythonpath = [
    "src"
]
addopts = "-ra -q --strict-markers --disable-warnings --maxfail=1 --cov=src --cov-report=term-missing"
testpaths = [
    "src/apps"
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100

target-version = "py313"

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*/migrations/*",
    "**/*schemas*.py",
    "**/manage.py"
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["F821"]

fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.isort]
known-local-folder = ["src"]
force-single-line = false
